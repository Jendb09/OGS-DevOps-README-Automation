
name: Assignment 4 CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Install Dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Archive Build
        run: zip -r build.zip dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    name: Deploy Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-v${{ needs.build.outputs.version }}-run.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'Build Tag: %s\n\n%s\n' "$TAG" "$NOTE" > release-notes.md

          gh release create "$TAG" build.zip \
            --title "Staging Release $TAG" \
            --notes-file release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA"

  deploy-staging:
    name: Deploy Staging
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: staging-v${{ needs.build.outputs.version }}-run.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip \
            --title "Staging Release $TAG" \
            --notes "Build Tag: $TAG

          $NOTE" \
            --prerelease \
            --target "$GITHUB_SHA"
  
  deploy-production:
    name: Deploy Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: prod-v${{ needs.build.outputs.version }}-run.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'Build Tag: %s\n\n%s\n' "$TAG" "$NOTE" > release-notes.md

          gh release create "$TAG" build.zip \
            --title "Production Release $TAG" \
            --notes-file release-notes.md \
            --latest \
            --target "$GITHUB_SHA"

